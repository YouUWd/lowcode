spring:
  datasource:
    url: "jdbc:h2:mem:low_code;MODE=MySQL;DATABASE_TO_UPPER=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS low_code\\;SET SCHEMA low_code"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jooq:
    sql-dialect: MYSQL

logging:
  level:
    com.lowcode: DEBUG
    org.jooq: INFO
    org.jooq.tools.LoggerListener: DEBUG
