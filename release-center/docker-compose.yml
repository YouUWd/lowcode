version: '3.8'

services:
  redis:
    image: redis:7.0-alpine
    container_name: release-center-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: release-center-backend
    ports:
      - "3000:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: supersecret
    depends_on:
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: release-center-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
